# ============================================================
# TSUZUKU — Render Blueprint Configuration
# Deploys as a fast, globally distributed Static Site with SPA routing
# ============================================================

services:
  - type: web
    name: tsuzuku
    runtime: static
    rootDir: tsuzuku-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # React Router SPA Rewrite: serve index.html for all subroutes
      - type: rewrite
        source: /*
        destination: /index.html
