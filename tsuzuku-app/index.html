<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Primary icon (browser tab) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="TSUZUKU — Master Japanese from zero to N1. Premium, science-based Japanese learning platform with adaptive SRS, kanji writing practice, and real grammar comprehension." />

    <!-- PWA & Mobile Fullscreen Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0C0C0F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TSUZUKU" />
    <!-- App icon shown on iOS home screen when "Add to Home Screen" -->
    <link rel="apple-touch-icon" href="/tsuzuku_app_icon.png" />

    <title>TSUZUKU | Master Japanese</title>

    <!-- ══ Open Graph (Facebook, Discord, Telegram, iMessage, WhatsApp, TinyURL preview) ══ -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tinyurl.com/Tsuzuku-JapaneseTutor" />
    <meta property="og:title" content="TSUZUKU | Master Japanese — N5 to N1" />
    <meta property="og:description" content="Your pocket Japanese teacher. Daily words, JLPT lessons from N5 to N1, kanji practice, and spaced repetition — all in one free app." />
    <meta property="og:image" content="/tsuzuku_app_logo.png" />
    <meta property="og:image:alt" content="TSUZUKU — Japanese Learning Platform" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="TSUZUKU" />

    <!-- ══ Twitter / X Card ══ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TSUZUKU | Master Japanese — N5 to N1" />
    <meta name="twitter:description" content="Your pocket Japanese teacher. Daily words, JLPT lessons from N5 to N1, kanji practice, and spaced repetition — all in one free app." />
    <meta name="twitter:image" content="/tsuzuku_app_logo.png" />
    <meta name="twitter:image:alt" content="TSUZUKU — Japanese Learning Platform" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist (Latin) + Noto Serif JP + Noto Sans JP -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;600;700&family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>

    <div id="root"></div>

  </body>
</html>
